<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="index.css">
    <title>Restaurant Ordering App</title>
</head>
<body>
    <header>
        <div class="main-container">
            <h1 class="text hero-text">Jimmy's Diner</h1>
            <h3 class="text hero-text">The best burgers and pizzas in town.</h3>
        </div>
    </header>

    <main>

        <div id="modal-window" hidden>
            <div id="modal-wrapper">
                <h2>Enter Card Details</h2>
                <form>
                <input id="name" type="text" placeholder="Enter your name" required>
                <input id="ccn" type="tel" inputmode="numeric"
                       autocomplete="cc-number" maxlength="19" pattern="[0-9]*"
                       placeholder="Enter card number" required>
                <input type="number" placeholder="Enter CVV" minlength="3" maxlength="3" required>
                <button id="submit-btn">Pay</button>
                </form>
            </div>
        </div>

        <div class="menu-container">

        </div>
    </main>

    <section id="cash-out">
        <div id="changable-container" class="menu-container">
            <h2>Your Order</h2>
            <div id="order-summary">
<!--                <div class="item-summary">-->
<!--                    <div class="summary-item-left">-->
<!--                        <h3>Pizza</h3>-->
<!--                        <p class="item-quantity">(2)</p>-->
<!--                        <span class="remove-btn">remove</span>-->
<!--                    </div>-->
<!--                    <div class="summary-item-right">-->
<!--                        <p class="item-cost">14$</p>-->
<!--                    </div>-->


<!--                </div>-->
            </div>
            <hr>
            <div id="total-price">
                <div class="item-left"><h4 style="font-size: 24px">Total Price:</h4></div>
                <div class="item-right"><p id="total-price-number" style="font-size: 20px">0$</p></div>
            </div>
            <button id="checkout-btn">Complete order</button>
        </div>
    </section>


    <script type="module" src="index.js"></script>
    <script type="module" src="data.js"></script>
</body>
</html>
